<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gasGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="8" />

  <!-- Industrial Safety Shield Outer -->
  <path d="M 256,76 L 396,136 C 396,286 336,386 256,436 C 176,386 116,286 116,136 Z" 
        fill="url(#shieldGrad)" 
        stroke="#0d9488" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Inner Dark Core -->
  <path d="M 256,98 L 376,150 C 376,276 324,364 256,408 C 188,364 136,276 136,150 Z" 
        fill="#0b1329" />

  <!-- Gas Sensor Pulse / Molecule Nodes -->
  <circle cx="256" cy="190" r="28" fill="url(#gasGlow)" filter="url(#glow)" />
  <circle cx="196" cy="270" r="20" fill="#38bdf8" />
  <circle cx="316" cy="270" r="20" fill="#38bdf8" />
  
  <line x1="256" y1="190" x2="196" y2="270" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="190" x2="316" y2="270" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- H₂S Chemical Text Banner -->
  <text x="256" y="375" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="76" 
        letter-spacing="2">H₂S</text>
  
  <!-- Active Safety Pulse Dot -->
  <circle cx="380" cy="116" r="16" fill="#10b981" />
  <circle cx="380" cy="116" r="24" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6" />
</svg>
